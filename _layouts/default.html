<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#0b2a45">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ site.url }}{{ site.profile_image }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b2a45'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Georgia' font-size='20' font-weight='700' fill='white'%3EPKM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/compact.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/viewport.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="container navbar">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-monogram">PKM</span><span><strong>Pankaj K. Mishra</strong><small>NIT Hamirpur · Control Systems</small></span></a>
    <button class="menu-button" aria-label="Open navigation" aria-expanded="false">☰</button>
    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
      <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research' %}class="active"{% endif %}>Research</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.url contains '/publications' %}class="active"{% endif %}>Publications</a>
      <a href="{{ '/students/' | relative_url }}" {% if page.url contains '/students' %}class="active"{% endif %}>Students</a>
      <a href="{{ '/teaching/' | relative_url }}" {% if page.url contains '/teaching' %}class="active"{% endif %}>Teaching</a>
      <a href="{{ '/articles/' | relative_url }}" {% if page.url contains '/articles' %}class="active"{% endif %}>Articles</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>Profile</a>
      <a class="cv-link" href="{{ site.cv_url }}" target="_blank">CV ↗</a>
    </nav>
  </div>
</header>
<main>{{ content }}</main>
<footer class="site-footer"><div class="container compact-footer"><span>© {{ 'now' | date: '%Y' }} Pankaj K. Mishra · NIT Hamirpur</span><span><a href="mailto:{{ site.email }}">{{ site.email }}</a> · <a href="{{ site.social.scholar }}" target="_blank">Scholar</a> · <a href="{{ site.social.linkedin }}" target="_blank">LinkedIn</a></span></div></footer>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
<script src="{{ '/assets/js/compact.js' | relative_url }}"></script>
</body>
</html>
